<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="#ffb646" stroke="#1b1f23" stroke-width="2"/>
  
  <!-- Bug body -->
  <ellipse cx="64" cy="60" rx="28" ry="32" fill="#f85a3e" stroke="#1b1f23" stroke-width="2"/>
  
  <!-- Bug head -->
  <circle cx="64" cy="32" r="22" fill="#f85a3e" stroke="#1b1f23" stroke-width="2"/>
  
  <!-- Left antenna -->
  <line x1="50" y1="15" x2="40" y2="5" stroke="#1b1f23" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="40" cy="5" r="3" fill="#1b1f23"/>
  
  <!-- Right antenna -->
  <line x1="78" y1="15" x2="88" y2="5" stroke="#1b1f23" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="88" cy="5" r="3" fill="#1b1f23"/>
  
  <!-- Left eye -->
  <circle cx="55" cy="28" r="5" fill="#fff" stroke="#1b1f23" stroke-width="1.5"/>
  <circle cx="55" cy="28" r="2.5" fill="#1b1f23"/>
  
  <!-- Right eye -->
  <circle cx="73" cy="28" r="5" fill="#fff" stroke="#1b1f23" stroke-width="1.5"/>
  <circle cx="73" cy="28" r="2.5" fill="#1b1f23"/>
  
  <!-- Laughing mouth (wide grin) -->
  <path d="M 55 42 Q 64 50 73 42" stroke="#1b1f23" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Left leg -->
  <line x1="48" y1="88" x2="42" y2="105" stroke="#1b1f23" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="42" cy="105" r="3" fill="#1b1f23"/>
  
  <!-- Right leg -->
  <line x1="80" y1="88" x2="86" y2="105" stroke="#1b1f23" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="86" cy="105" r="3" fill="#1b1f23"/>
  
  <!-- Left code bracket < -->
  <g transform="translate(15, 64)">
    <path d="M 12 5 L 0 15 L 12 25" stroke="#1b1f23" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Right code bracket > -->
  <g transform="translate(101, 64)">
    <path d="M 0 5 L 12 15 L 0 25" stroke="#1b1f23" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Laugh lines (motion) -->
  <line x1="25" y1="35" x2="20" y2="30" stroke="#1b1f23" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="103" y1="35" x2="108" y2="30" stroke="#1b1f23" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
